name: Publish VK Leads to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/community-feed.json'
      - 'collector-data/state.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Only the latest UI release should deploy; an obsolete waiting run must
  # not hold every subsequent release in the concurrency queue.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A queued UI deploy must not overwrite a newer collector feed with
          # the triggering commit's old snapshot.
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node server/wait-pages-artifact.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
