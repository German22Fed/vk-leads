name: Collect VK communities
on:
  push:
    branches: [main]
    paths: ['server/**', 'dist/vk-data.js', 'dist/collector-engine.js', 'dist/id-discovery.js', '.github/workflows/vk-collector.yml']
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vk-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Monitor and publish verified snapshots
        id: watch
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          # A release gets a short first session; successors run for 50 minutes.
          MONITOR_MINUTES: ${{ github.event_name == 'push' && '15' || '50' }}
        run: node server/watch-collector.mjs
      - name: Queue next monitoring session
        if: success() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node server/continue-collector.mjs
